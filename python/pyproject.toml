[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqawkpy"
version = "0.1.0"
description = "A comprehensive resilience and transient-fault-handling library for Python, ported from .NET Polly."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "SqawkPy Contributors" }
]
keywords = [
    "resilience",
    "retry",
    "circuit-breaker",
    "timeout",
    "rate-limiting",
    "fallback",
    "hedging",
    "polly"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.10.0; python_version < '3.12'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
]
bench = [
    "pytest-benchmark>=4.0.0",
]
dev = [
    "sqawkpy[test,bench]",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "mutmut>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sqawk"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "hypothesis: tests using hypothesis property-based testing",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

